sonar.projectKey=discountedcookie_10x-mapmaster
sonar.organization=discountedcookie

# Project info
sonar.projectName=10x-mapmaster
sonar.projectVersion=1.0

# Source and test paths
sonar.sources=src
sonar.tests=src/__tests__,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Exclusions
sonar.exclusions=dist/**,node_modules/**,coverage/**,**/*.spec.ts,**/*.test.ts,src/__tests__/**,e2e/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# JavaScript/TypeScript settings
sonar.javascript.node.maxspace=4096
