name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  # CodeQL runs via GitHub's default setup - see Security settings
  # Removed custom CodeQL job to avoid conflict

  dependency-audit:
    name: NPM Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run npm audit (production only)
        run: npm audit --production --audit-level=high

  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/typescript
            p/vue

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail=false
        continue-on-error: true

  scorecard:
    name: OSSF Scorecard
    # Only run on schedule and main branch pushes
    if: github.event_name == 'schedule' || github.event_name == 'branch_protection_rule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  bundle-size:
    name: Bundle Size Check
    # Only run on pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Analyze bundle size
        uses: preactjs/compressed-size-action@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: 'dist/assets/*.{js,css}'
          exclude: '{dist/assets/*.map,**/*.txt}'
          compression: 'gzip'
          minimum-change-threshold: 100

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, semgrep, secret-scan]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Security scans completed"
          echo "Dependency Audit: ${{ needs.dependency-audit.result }}"
          echo "Semgrep Scan: ${{ needs.semgrep.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "CodeQL runs separately via GitHub default setup"
